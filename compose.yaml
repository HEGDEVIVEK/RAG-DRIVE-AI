name: rag-drive-ai

services:
  frontend:
    image: vivekhegde78/rag-frontend:v1
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: vivekhegde78/rag-backend:v1
    env_file:
      - ./rag_python_backend/.env
    environment:
      CLIENT_URL: http://localhost:5173
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    image: vivekhegde78/rag-worker:v1
    env_file:
      - ./rag_python_backend/.env
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
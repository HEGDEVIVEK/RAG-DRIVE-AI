server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;


    # Forward API requests to the FastAPI container.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_read_timeout 120s;
    }

    # Serve React files and support React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}